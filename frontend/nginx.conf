server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 静的ファイルのキャッシュ設定
    # 正規表現マッチのため、静的ファイルのリクエストはここで処理される
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 静的ファイルが見つからない場合は404を返す
        try_files $uri =404;
    }

    # SPA用の設定: 存在しないパスはindex.htmlにフォールバック
    # すべてのパスに対して、まずファイルを探し、見つからなければindex.htmlを返す
    # これにより、ルート以外のパス（例: /hanchans/123, /sessions/456）でもリロード時にindex.htmlが返される
    location / {
        # まずリクエストされたURIを探し、見つからなければディレクトリを探し、それでも見つからなければindex.htmlを返す
        try_files $uri $uri/ /index.html;
    }
}

